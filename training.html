<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="BeerFactory">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17120e">
<link rel="icon" type="image/png" sizes="32x32" href="apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BeerFactory — Обучение</title>
<style>
  :root {
    --bg-main: #17120e;
    --bg-card: rgba(38, 28, 20, 0.9);
    --accent-amber: #f5a623;
    --accent-amber-glow: rgba(245, 166, 35, 0.25);
    --accent-green: #34c759;
    --accent-red: #ff3b30;
    --text-primary: #f5f5f7;
    --text-secondary: #a1a1a6;
    --border-subtle: rgba(245, 166, 35, 0.15);
    --apple-ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { 
    box-sizing: border-box; 
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    max-width: 100%;
    overflow-x: hidden;
  }

  body {
    margin: 0;
    background-color: var(--bg-main);
    background-image: 
      radial-gradient(circle at 50% 0%, var(--accent-amber-glow), transparent 60%),
      radial-gradient(circle at 80% 100%, rgba(245, 166, 35, 0.08), transparent 50%);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
    padding: 0 0 80px;
    min-height: 100vh;
  }

  /* Индикатор прогресса чтения */
  .progress-rail { 
    position: sticky; 
    top: 0; 
    z-index: 40; 
    height: 3px; 
    background: rgba(255, 255, 255, 0.05); 
  }
  .progress-fill {
    height: 100%; 
    width: 0%;
    background: var(--accent-amber);
    box-shadow: 0 0 10px var(--accent-amber-glow);
    transition: width 0.1s linear;
  }

  /* Header */
  header {
    padding: 50px 20px 24px;
    text-align: center;
    border-bottom: 1px solid var(--border-subtle);
    background: rgba(23, 18, 14, 0.6);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .kicker {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--accent-amber);
    margin-bottom: 8px;
  }
  h1 {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    line-height: 1.05;
    color: var(--text-primary);
  }
  .sub {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 8px;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 18px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--accent-amber);
    text-decoration: none;
    background: rgba(245, 166, 35, 0.08);
    border: 1px solid var(--border-subtle);
    padding: 8px 18px;
    border-radius: 980px;
    transition: opacity 0.2s var(--apple-ease), transform 0.1s var(--apple-ease), border-color 0.2s var(--apple-ease), background 0.2s var(--apple-ease);
  }
  .back-link:hover { 
    border-color: var(--accent-amber); 
    background: rgba(245, 166, 35, 0.15);
  }
  .back-link:active {
    transform: scale(0.98);
  }

  /* Container */
  .page {
    width: 100%;
    max-width: 640px;
    margin: 24px auto 0;
    padding: 0 16px;
  }

  /* Topbar & Search */
  .topbar { 
    display: flex; 
    align-items: center; 
    gap: 12px; 
    margin-bottom: 14px; 
  }

  .menu-trigger {
    flex-shrink: 0;
    width: auto;
    display: flex; 
    align-items: center; 
    gap: 8px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 980px;
    padding: 10px 18px;
    cursor: pointer;
    color: var(--text-primary);
    transition: opacity 0.2s var(--apple-ease), transform 0.1s var(--apple-ease), background 0.2s var(--apple-ease);
  }
  .menu-trigger:hover { background: rgba(255, 255, 255, 0.12); }
  .menu-trigger:active { transform: scale(0.98); }
  .menu-trigger .mt-icon { font-size: 14px; flex-shrink: 0; color: var(--accent-amber); }
  .menu-trigger .mt-label {
    font-size: 12px; 
    font-weight: 600;
    letter-spacing: 0.05em; 
    text-transform: uppercase;
    color: var(--accent-amber); 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis;
    max-width: 34vw;
  }
  .menu-trigger .mt-chev { color: var(--text-secondary); font-size: 11px; flex-shrink: 0; }

  .search-slot {
    flex: 1;
    display: flex; 
    justify-content: flex-end; 
    align-items: center;
    position: relative;
    min-width: 0;
  }
  .search-icon-btn {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    height: 40px;
    padding: 0 18px;
    border-radius: 980px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-primary);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    white-space: nowrap;
    cursor: pointer;
    transition: opacity 0.2s var(--apple-ease), transform 0.1s var(--apple-ease), background 0.2s var(--apple-ease);
  }
  .search-icon-btn:hover { background: rgba(255, 255, 255, 0.12); }
  .search-icon-btn:active { transform: scale(0.98); }
  .search-slot.open .search-icon-btn { display: none; }

  input[type="text"]#search {
    width: 0; 
    min-width: 0; 
    opacity: 0;
    padding: 0; 
    border: none;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 980px;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 16px;
    outline: none;
    transition: width 0.3s var(--apple-ease), opacity 0.2s var(--apple-ease), padding 0.3s var(--apple-ease), border-color 0.2s var(--apple-ease);
  }
  .search-slot.open input[type="text"]#search {
    width: 100%; 
    opacity: 1;
    padding: 10px 18px;
    border: 1px solid var(--border-subtle);
  }
  .search-slot.open input[type="text"]#search:focus { border-color: var(--accent-amber); }
  input[type="text"]#search::placeholder { color: var(--text-secondary); }

  /* Feed & Topic Groups */
  .feed { margin-top: 24px; }
  .topic-group { margin-bottom: 32px; }
  .topic-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text-primary);
    display: flex; 
    align-items: center; 
    gap: 10px;
    margin: 0 0 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .topic-title .ic { font-size: 20px; }

  /* Entry Accordions */
  .entry {
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-subtle);
    border-radius: 20px;
    margin-bottom: 12px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    transition: border-color 0.2s var(--apple-ease);
  }
  .entry:hover {
    border-color: rgba(245, 166, 35, 0.3);
  }
  .entry-head {
    width: 100%;
    display: flex; 
    align-items: center; 
    gap: 12px;
    background: none; 
    border: none; 
    cursor: pointer;
    padding: 18px 20px;
    text-align: left;
    color: var(--text-primary);
  }
  .entry-head:active {
    background: rgba(255, 255, 255, 0.02);
  }
  .entry-icon { font-size: 18px; flex-shrink: 0; }
  .entry-title {
    flex: 1; 
    min-width: 0;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text-primary);
    transition: color 0.2s var(--apple-ease);
  }
  .entry-head:hover .entry-title { color: var(--accent-amber); }
  .entry-meta {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--accent-amber);
    background: rgba(245, 166, 35, 0.1);
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid rgba(245, 166, 35, 0.15);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .entry-chevron {
    font-size: 12px; 
    color: var(--text-secondary);
    transition: transform 0.3s var(--apple-ease);
    flex-shrink: 0;
  }
  .entry.open .entry-chevron { transform: rotate(180deg); }

  .entry-body { 
    display: grid; 
    grid-template-rows: 0fr; 
    transition: grid-template-rows 0.4s var(--apple-ease); 
  }
  .entry.open .entry-body { grid-template-rows: 1fr; }
  .entry-body-inner { overflow: hidden; min-height: 0; }
  .entry-content {
    padding: 0 20px 20px;
    font-size: 15px;
    line-height: 1.6;
    color: var(--text-secondary);
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    margin-top: 4px;
    padding-top: 16px;
  }
  .entry-content p { margin: 0 0 14px; }
  .entry-content p:last-child { margin-bottom: 0; }
  .entry-content strong { color: var(--text-primary); font-weight: 600; }
  .entry-content em { font-style: italic; color: var(--text-primary); }
  .entry-content ul, .entry-content ol { margin: 0 0 14px; padding-left: 20px; }
  .entry-content li { margin-bottom: 6px; }
  .entry-content blockquote {
    margin: 0 0 14px;
    padding: 12px 16px;
    border-left: 3px solid var(--accent-amber);
    background: rgba(245, 166, 35, 0.08);
    border-radius: 0 12px 12px 0;
    font-style: italic;
    color: var(--text-primary);
  }
  .entry-content mark {
    background: rgba(245, 166, 35, 0.2);
    color: var(--accent-amber);
    padding: 2px 6px;
    border-radius: 4px;
  }

  /* Personal Notes */
  .entry-note { margin-top: 16px; padding-top: 12px; border-top: 1px rgba(255, 255, 255, 0.05) solid; }
  .note-toggle {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-primary);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 980px;
    padding: 6px 14px;
    cursor: pointer;
    transition: opacity 0.2s var(--apple-ease), transform 0.1s var(--apple-ease), background 0.2s var(--apple-ease);
  }
  .note-toggle:hover { 
    background: rgba(255, 255, 255, 0.12);
    border-color: var(--border-subtle);
  }
  .note-toggle:active { transform: scale(0.98); }
  .note-area {
    display: none;
    width: 100%;
    margin-top: 10px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 14px;
    padding: 12px;
    min-height: 80px;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s var(--apple-ease);
  }
  .note-area:focus {
    border-color: var(--accent-amber);
  }
  .note-area.visible { display: block; }
  .note-saved {
    font-size: 11px;
    color: var(--accent-green);
    margin-top: 6px;
    height: 14px;
    font-weight: 500;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    font-size: 14px;
    color: var(--text-secondary);
  }
  .empty .big { font-size: 32px; display: block; margin-bottom: 12px; }

  /* Drawer Navigation */
  .drawer-overlay {
    position: fixed; 
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0; 
    pointer-events: none;
    transition: opacity 0.3s var(--apple-ease);
    z-index: 90;
  }
  .drawer-overlay.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed; 
    top: 0; 
    left: 0; 
    bottom: 0;
    width: min(320px, 85vw);
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-right: 1px solid var(--border-subtle);
    z-index: 91;
    transform: translateX(-100%);
    transition: transform 0.4s var(--apple-ease);
    display: flex; 
    flex-direction: column;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
  }
  .drawer.open { transform: translateX(0); }

  .drawer-head {
    display: flex; 
    align-items: center; 
    justify-content: space-between;
    padding: 24px 20px 16px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .drawer-head .dh-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text-primary);
  }
  .drawer-close {
    background: rgba(255, 255, 255, 0.08); 
    border: none;
    color: var(--text-secondary);
    font-size: 20px; 
    line-height: 1;
    cursor: pointer;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s var(--apple-ease), background 0.2s var(--apple-ease);
  }
  .drawer-close:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.15); }

  .drawer-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 10px;
    display: flex; 
    flex-direction: column; 
    gap: 4px;
  }
  .drawer-item {
    display: flex; 
    align-items: center; 
    gap: 12px;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 0.2s var(--apple-ease), color 0.2s var(--apple-ease), transform 0.1s var(--apple-ease);
  }
  .drawer-item .di-icon { font-size: 16px; flex-shrink: 0; }
  .drawer-item .di-label { flex: 1; }
  .drawer-item .di-count { 
    font-size: 11px; 
    font-weight: 600;
    color: var(--text-secondary);
    background: rgba(255, 255, 255, 0.08);
    padding: 2px 6px;
    border-radius: 6px;
  }
  .drawer-item:hover { background: rgba(245, 166, 35, 0.08); color: var(--text-primary); }
  .drawer-item:active { transform: scale(0.98); }
  .drawer-item.active {
    background: rgba(245, 166, 35, 0.15);
    color: var(--accent-amber);
    font-weight: 600;
  }
  .drawer-item.active .di-count {
    background: rgba(245, 166, 35, 0.2);
    color: var(--accent-amber);
  }

  /* Scroll To Top Button */
  .to-top {
    position: fixed; 
    right: 20px; 
    bottom: 24px;
    width: 48px; 
    height: 48px; 
    border-radius: 980px;
    background: var(--accent-amber); 
    color: #17120e; 
    border: none;
    font-size: 20px; 
    font-weight: 600;
    line-height: 1; 
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    opacity: 0; 
    pointer-events: none; 
    transform: translateY(10px);
    transition: opacity 0.2s var(--apple-ease), transform 0.2s var(--apple-ease);
    z-index: 50;
  }
  .to-top:active { transform: scale(0.95); }
  .to-top.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }

  @media (prefers-reduced-motion: reduce){
    .entry-body, .entry-chevron, .drawer, .drawer-overlay { transition: none; }
  }
    /* Контейнер для кнопок в шапке */
  .nav-actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-top: 18px;
  }

  .nav-actions .back-link {
    margin-top: 0;
  }

  /* Кнопка «Пройти аттестацию» */
  .attestation-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #17120e;
    text-decoration: none;
    background: var(--accent-amber);
    border: 1px solid var(--accent-amber);
    padding: 8px 18px;
    border-radius: 980px;
    box-shadow: 0 4px 15px var(--accent-amber-glow);
    transition: opacity 0.2s var(--apple-ease), transform 0.1s var(--apple-ease), background 0.2s var(--apple-ease);
  }

  .attestation-btn:hover {
    background: #e0951d;
    border-color: #e0951d;
  }

  .attestation-btn:active {
    transform: scale(0.98);
  }
</style>
</head>
<body>

<div class="progress-rail"><div class="progress-fill" id="progressFill"></div></div>

<header>
  <div class="kicker">@BEERFACTORYbot · обучение персонала</div>
  <h1>BEERFACTORY</h1>
  <div class="sub">история, правила и матчасть — читай по темам</div>
   <div class="nav-actions">
    <a href="index.html" class="back-link">← Назад к ТТК</a>
    <a href="attestation.html" class="attestation-btn">Пройти аттестацию →</a>
  </div>
</header>

<div class="page">
  <div class="topbar">
    <button class="menu-trigger" id="menuBtn">
      <span class="mt-icon">☰</span>
      <span class="mt-label" id="menuLabel">Все темы</span>
      <span class="mt-chev">▾</span>
    </button>
    <div class="search-slot" id="searchSlot">
      <button class="search-icon-btn" id="searchIconBtn" aria-label="Поиск">🔎 Поиск</button>
      <input type="text" id="search" placeholder="найти по статьям...">
    </div>
  </div>

  <main class="feed" id="feed"></main>

  <div class="empty" id="empty" style="display:none">
    <span class="big">📭</span>
    <span id="emptyText">Ничего не нашлось. Попробуй другое слово.</span>
  </div>
</div>

<!-- Боковой слайдер с темами -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <span class="dh-title">Темы</span>
    <button class="drawer-close" id="drawerClose" aria-label="Закрыть">×</button>
  </div>
  <nav class="drawer-list" id="drawerList"></nav>
</aside>

<button class="to-top" id="toTop" aria-label="Наверх">↑</button>

<script>
// ====== ДЕМО-СТАТЬИ ======
// Показываются, если файл training-data.txt ещё не загружен в репозиторий
// или запрос к нему не удался — чтобы страница не оставалась пустой.
const DEMO_ITEMS = [
  {
    category: "История алкоголя", icon: "🍺",
    title: "Откуда взялось виски",
    body: "Виски появилось в Ирландии и Шотландии около 15 века. Название происходит от гэльского \"uisce beatha\" — \"вода жизни\". Изначально его делали монахи как лекарство.\n\nК 18 веку производство разрослось настолько, что власти обложили его налогом — это привело к волне подпольных вискокурен в горах Шотландии."
  },
  {
    category: "История алкоголя", icon: "🍺",
    title: "Как появилось пиво",
    body: "Пиво — один из старейших напитков человечества, первые упоминания найдены в Древнем Шумере более 5000 лет назад.\n\nВ Средние века пиво в Европе часто было безопаснее воды — процесс варки убивал большинство патогенов, поэтому его пили даже дети."
  },
  {
    category: "Правила бара", icon: "📋",
    title: "Дресс-код персонала",
    body: "Чёрная рубашка, тёмные брюки, закрытая обувь. Бейдж обязателен на смене.\n\nУкрашения — минимально, ничего звенящего и цепляющегося за поднос."
  },
  {
    category: "Правила бара", icon: "📋",
    title: "Как встречать гостей",
    body: "Приветствие в течение 30 секунд после посадки за стол. Улыбка, зрительный контакт, представиться по имени.\n\nЕсли видишь, что гость уже минуту ищет взглядом официанта — подойди, даже если не твой стол."
  },
  {
    category: "Виды напитков", icon: "🥃",
    title: "Что такое настойка",
    body: "Настойка — алкогольный напиток, полученный настаиванием трав, ягод или фруктов на спиртовой основе. Отличается от ликёра меньшим содержанием сахара."
  },
];

// Формат training-data.txt:
//   "### 🍺 Название категории"  — новая категория (эмодзи в начале — опционально)
//   "## Заголовок статьи"        — новая карточка внутри категории
//   всё остальное — текст статьи, до следующего ## или ###
async function loadTrainingData(){
  try{
    const res = await fetch('training-data.txt');
    if(!res.ok) throw new Error("training-data.txt не найден (" + res.status + ")");
    const raw = await res.text();
    if(!raw.trim()) throw new Error("training-data.txt пустой");
    return parseTrainingData(raw);
  }catch(e){
    console.warn("Файл training-data.txt не подключён, показаны демо-статьи:", e);
    return DEMO_ITEMS;
  }
}

function parseTrainingData(raw){
  const lines = raw.split('\n');
  const items = [];
  let currentCategory = 'Общее';
  let currentIcon = '📖';
  let currentTitle = null;
  let currentBody = [];

  function pushCurrent(){
    if(currentTitle){
      items.push({
        category: currentCategory,
        icon: currentIcon,
        title: currentTitle,
        body: currentBody.join('\n').trim()
      });
    }
  }

  for(const line of lines){
    if(line.startsWith('### ')){
      pushCurrent();
      const rawCat = line.replace('### ', '').trim();
      const parts = rawCat.split(' ');
      if(parts.length > 1 && /\p{Extended_Pictographic}/u.test(parts[0])){
        currentIcon = parts[0];
        currentCategory = parts.slice(1).join(' ');
      } else {
        currentIcon = '📖';
        currentCategory = rawCat;
      }
      currentTitle = null;
      currentBody = [];
    } else if(line.startsWith('## ')){
      pushCurrent();
      currentTitle = line.replace('## ', '').trim();
      currentBody = [];
    } else {
      currentBody.push(line);
    }
  }
  pushCurrent();
  return items;
}

let ALL_ITEMS = [];
let state = { cat: 'all', query: '' };

function noteKey(item){ return 'bf_training_note::' + item.category + '::' + item.title; }
function readingTime(text){
  const words = text.trim().split(/\s+/).filter(Boolean).length;
  return Math.max(1, Math.round(words / 180));
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// Мини-разметка внутри training-data.txt (применяется ПОСЛЕ escapeHtml — безопасно):
//   **жирный**   → <strong>
//   *курсив*      → <em>
//   строка "- "   → пункт списка
//   строка "> "   → цитата-подсказка
function inlineFormat(escaped){
  return escaped
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+?)\*(?!\*)/g, '$1<em>$2</em>');
}

function formatParagraph(raw){
  const lines = raw.split('\n').filter(l => l.trim() !== '');
  if(lines.length === 0) return '';

  if(lines.every(l => l.trim().startsWith('- '))){
    const items = lines.map(l => `<li>${inlineFormat(escapeHtml(l.trim().slice(2)))}</li>`).join('');
    return `<ul>${items}</ul>`;
  }
  if(lines.every(l => l.trim().startsWith('> '))){
    const text = lines.map(l => inlineFormat(escapeHtml(l.trim().slice(2)))).join('<br>');
    return `<blockquote>${text}</blockquote>`;
  }
  return `<p>${inlineFormat(escapeHtml(raw)).replace(/\n/g,'<br>')}</p>`;
}
function matches(item){
  if(state.cat !== 'all' && item.category !== state.cat) return false;
  if(state.query){
    const q = state.query.toLowerCase();
    const hay = (item.title + ' ' + item.body).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

// ===== Боковой слайдер с темами =====
const drawer = document.getElementById('drawer');
const drawerOverlay = document.getElementById('drawerOverlay');

function openDrawer(){
  drawer.classList.add('open');
  drawerOverlay.classList.add('open');
  document.body.style.overflow = 'hidden'; // блокируем скролл фона под слайдером
}
function closeDrawer(){
  drawer.classList.remove('open');
  drawerOverlay.classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('menuBtn').addEventListener('click', openDrawer);
document.getElementById('drawerClose').addEventListener('click', closeDrawer);
drawerOverlay.addEventListener('click', closeDrawer);

function renderDrawer(){
  const categories = [...new Map(ALL_ITEMS.map(i => [i.category, i.icon])).entries()];
  const listEl = document.getElementById('drawerList');
  const allCount = ALL_ITEMS.length;

  let html = `<button class="drawer-item ${state.cat==='all'?'active':''}" data-cat="all">
      <span class="di-icon">📚</span><span class="di-label">Все темы</span><span class="di-count">${allCount}</span>
    </button>`;

  categories.forEach(([cat, icon]) => {
    const count = ALL_ITEMS.filter(i => i.category === cat).length;
    html += `<button class="drawer-item ${state.cat===cat?'active':''}" data-cat="${escapeHtml(cat)}">
      <span class="di-icon">${icon}</span><span class="di-label">${escapeHtml(cat)}</span><span class="di-count">${count}</span>
    </button>`;
  });

  listEl.innerHTML = html;
}

document.getElementById('drawerList').addEventListener('click', (e) => {
  const btn = e.target.closest('.drawer-item');
  if(!btn) return;
  state.cat = btn.dataset.cat;
  renderDrawer();
  updateMenuTrigger();
  render();
  closeDrawer(); // выбрали тему — слайдер сворачивается сам
});

function updateMenuTrigger(){
  const cats = new Map(ALL_ITEMS.map(i => [i.category, i.icon]));
  const label = state.cat === 'all' ? 'Все темы' : (cats.get(state.cat) + ' ' + state.cat);
  document.getElementById('menuLabel').textContent = label;
}

// ===== Лента статей =====
function render(){
  const feed = document.getElementById('feed');
  const empty = document.getElementById('empty');
  const emptyText = document.getElementById('emptyText');
  const list = ALL_ITEMS.filter(matches);

  feed.innerHTML = '';

  if(list.length === 0){
    empty.style.display = 'block';
    emptyText.textContent = ALL_ITEMS.length === 0
      ? 'Статей пока нет — как только они появятся, лента заполнится сама.'
      : 'Ничего не нашлось. Попробуй другое слово.';
    return;
  }
  empty.style.display = 'none';

  // группируем отфильтрованный список по темам, сохраняя порядок первого появления
  const groups = [];
  const groupByCat = new Map();
  list.forEach(item => {
    if(!groupByCat.has(item.category)){
      const g = { category: item.category, icon: item.icon, items: [] };
      groupByCat.set(item.category, g);
      groups.push(g);
    }
    groupByCat.get(item.category).items.push(item);
  });

  groups.forEach(group => {
    const section = document.createElement('section');
    section.className = 'topic-group';
    section.innerHTML = `<h2 class="topic-title"><span class="ic">${group.icon}</span>${escapeHtml(group.category)}</h2>`;

    group.items.forEach(item => {
      const mins = readingTime(item.body);
      const paragraphs = item.body.split('\n\n').map(formatParagraph).join('');

      const entry = document.createElement('article');
      entry.className = 'entry';
      entry.innerHTML = `
        <button class="entry-head">
          <span class="entry-icon">${item.icon}</span>
          <span class="entry-title">${escapeHtml(item.title)}</span>
          <span class="entry-meta">${mins} мин</span>
          <span class="entry-chevron">⌄</span>
        </button>
        <div class="entry-body">
          <div class="entry-body-inner">
            <div class="entry-content">
              ${paragraphs}
              <div class="entry-note">
                <button class="note-toggle">📝 Заметка</button>
                <textarea class="note-area" placeholder="твоя личная заметка (видна только тебе на этом телефоне)"></textarea>
                <div class="note-saved"></div>
              </div>
            </div>
          </div>
        </div>`;

      const head = entry.querySelector('.entry-head');
      head.addEventListener('click', () => entry.classList.toggle('open'));

      const noteBtn = entry.querySelector('.note-toggle');
      const noteArea = entry.querySelector('.note-area');
      const noteSaved = entry.querySelector('.note-saved');
      const key = noteKey(item);
      const existing = localStorage.getItem(key);
      if(existing){ noteArea.value = existing; noteSaved.textContent = 'заметка сохранена'; }

      noteBtn.addEventListener('click', () => {
        noteArea.classList.toggle('visible');
        if(noteArea.classList.contains('visible')) noteArea.focus();
      });
      let saveTimer = null;
      noteArea.addEventListener('input', () => {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          if(noteArea.value.trim()){
            localStorage.setItem(key, noteArea.value);
            noteSaved.textContent = 'сохранено ✓';
          } else {
            localStorage.removeItem(key);
            noteSaved.textContent = '';
          }
        }, 500);
      });

      section.appendChild(entry);
    });

    feed.appendChild(section);
  });
}

function pluralStatey(n){
  const mod10 = n % 10, mod100 = n % 100;
  if(mod10 === 1 && mod100 !== 11) return 'статья';
  if([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return 'статьи';
  return 'статей';
}

const searchSlot = document.getElementById('searchSlot');
const searchInput = document.getElementById('search');

document.getElementById('searchIconBtn').addEventListener('click', () => {
  searchSlot.classList.add('open');
  searchInput.focus();
});
searchInput.addEventListener('blur', () => {
  if(!searchInput.value.trim()) searchSlot.classList.remove('open');
});
searchInput.addEventListener('input', (e) => {
  state.query = e.target.value.trim();
  render();
});

// ===== Индикатор прогресса чтения =====
const progressFill = document.getElementById('progressFill');
function updateProgress(){
  const h = document.documentElement;
  const scrolled = h.scrollTop;
  const max = h.scrollHeight - h.clientHeight;
  progressFill.style.width = (max > 0 ? (scrolled / max) * 100 : 0) + '%';
}
window.addEventListener('scroll', updateProgress);

// ===== Кнопка "наверх" =====
const toTopBtn = document.getElementById('toTop');
window.addEventListener('scroll', () => {
  toTopBtn.classList.toggle('visible', window.scrollY > window.innerHeight * 0.6);
});
toTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

loadTrainingData().then(items => {
  ALL_ITEMS = items;
  renderDrawer();
  updateMenuTrigger();
  render();
});
</script>
