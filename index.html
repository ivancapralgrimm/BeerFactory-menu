<!DOCTYPE html>  
<html lang="ru">  
<head>  
  <!-- Универсальные мобильные иконки для BeerFactory -->  
  
<!-- Настройки для iPhone -->  
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">  
<meta name="apple-mobile-web-app-title" content="BeerFactory">  
<meta name="apple-mobile-web-app-capable" content="yes">  
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">  
  
<!-- Настройки для Android и других браузеров -->  
<link rel="manifest" href="manifest.json">  
<meta name="theme-color" content="#17120e">  
  
<!-- Иконка для вкладок браузера на ПК -->  
<link rel="icon" type="image/png" sizes="32x32" href="apple-touch-icon.png">  
<meta charset="UTF-8">  
<!-- viewport — чтобы на телефоне сайт не масштабировался как десктопная версия,  
     и чтобы поле ввода при фокусе не вызывало авто-зум браузера -->  
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">  
<title>BeerFactory — меню</title>  
<style>  
  :root {  
    --bg-main: #17120e;  
    --bg-card: rgba(38, 28, 20, 0.9);  
    --accent-amber: #f5a623;  
    --accent-amber-glow: rgba(245, 166, 35, 0.25);  
    --accent-green: #34c759;  
    --accent-red: #ff3b30;  
    --text-primary: #f5f5f7;  
    --text-secondary: #a1a1a6;  
    --border-subtle: rgba(245, 166, 35, 0.15);  
    --apple-ease: cubic-bezier(0.16, 1, 0.3, 1);  
  }  

  * { 
    box-sizing: border-box; 
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }  

  html, body {  
    height: 100%;  
    height: 100dvh;  
  }  
  html {  
    overflow: hidden;  
  }  
  
  body {  
    margin: 0;  
    background-color: var(--bg-main);
    background-image: 
      radial-gradient(circle at 50% 0%, var(--accent-amber-glow), transparent 60%),
      radial-gradient(circle at 80% 100%, rgba(245, 166, 35, 0.08), transparent 50%);
    color: var(--text-primary);  
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
    padding: 0 0 60px;  
    min-height: 100%;  
    overflow-y: auto;  
    overflow-x: hidden;  
    -webkit-overflow-scrolling: touch;  
  }  

  /* Header */
  header {  
    padding: 50px 20px 24px;  
    text-align: center;  
    border-bottom: 1px solid var(--border-subtle);  
    background: rgba(23, 18, 14, 0.6);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }  
  .kicker {  
    font-size: 12px;  
    font-weight: 600;
    letter-spacing: 0.05em;  
    text-transform: uppercase;  
    color: var(--accent-amber);  
    margin-bottom: 8px;  
  }  
  h1 {  
    font-size: 42px;  
    font-weight: 700;
    letter-spacing: -0.01em;  
    margin: 0;  
    line-height: 1.05;  
    color: var(--text-primary);
  }  
  .sub {  
    font-size: 13px;  
    color: var(--text-secondary);  
    margin-top: 8px;  
  }  
  .training-link {  
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 18px;  
    font-size: 12px;  
    font-weight: 600;
    letter-spacing: 0.02em;  
    color: var(--accent-amber);  
    text-decoration: none;  
    background: rgba(245, 166, 35, 0.08);
    border: 1px solid var(--border-subtle);  
    padding: 8px 18px;  
    border-radius: 980px;  
    transition: opacity 0.2s var(--apple-ease), transform 0.1s var(--apple-ease), border-color 0.2s var(--apple-ease);
  }  
  .training-link:hover { 
    border-color: var(--accent-amber); 
    background: rgba(245, 166, 35, 0.15);
  }  
  .training-link:active {
    transform: scale(0.98);
  }

  /* Controls & Search */
  .controls {  
    max-width: 640px;  
    margin: 24px auto 0;  
    padding: 0 16px;  
  }  

  .topbar { 
    display: flex; 
    align-items: center; 
    gap: 12px; 
    margin-bottom: 14px; 
  }  

  .menu-trigger {  
    flex-shrink: 0;  
    display: flex; 
    align-items: center; 
    gap: 8px;  
    background: rgba(255, 255, 255, 0.08);  
    border: 1px solid rgba(255, 255, 255, 0.1);  
    border-radius: 980px;  
    padding: 10px 18px;  
    cursor: pointer;  
    color: var(--text-primary);  
    transition: opacity 0.2s var(--apple-ease), transform 0.1s var(--apple-ease), background 0.2s var(--apple-ease);
  }  
  .menu-trigger:hover { 
    background: rgba(255, 255, 255, 0.12);
  }  
  .menu-trigger:active {
    transform: scale(0.98);
  }
  .menu-trigger .mt-icon { font-size: 14px; flex-shrink: 0; color: var(--accent-amber); }  
  .menu-trigger .mt-label {  
    font-size: 12px; 
    font-weight: 600;
    letter-spacing: 0.05em; 
    text-transform: uppercase;  
    color: var(--accent-amber);  
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis;  
    max-width: 34vw;  
  }  
  .menu-trigger .mt-chev { color: var(--text-secondary); font-size: 11px; flex-shrink: 0; }  

  .search-slot {  
    flex: 1;  
    display: flex; 
    justify-content: flex-end; 
    align-items: center;  
    position: relative;  
    min-width: 0;  
  }  
  .search-icon-btn {  
    flex-shrink: 0;  
    display: flex; 
    align-items: center; 
    gap: 6px;  
    height: 40px;  
    padding: 0 18px;  
    border-radius: 980px;  
    background: rgba(255, 255, 255, 0.08);  
    border: 1px solid rgba(255, 255, 255, 0.1);  
    color: var(--text-primary);  
    font-size: 12px;  
    font-weight: 600;
    letter-spacing: 0.05em;  
    text-transform: uppercase;  
    white-space: nowrap;  
    cursor: pointer;  
    transition: opacity 0.2s var(--apple-ease), transform 0.1s var(--apple-ease), background 0.2s var(--apple-ease);
  }  
  .search-icon-btn:hover { background: rgba(255, 255, 255, 0.12); }  
  .search-icon-btn:active { transform: scale(0.98); }
  .search-slot.open .search-icon-btn { display: none; }  

  input[type="text"] {  
    width: 0; 
    min-width: 0; 
    opacity: 0;  
    padding: 0; 
    border: none;  
    background: rgba(255, 255, 255, 0.08);  
    border-radius: 980px;  
    color: var(--text-primary);  
    font-family: inherit;
    font-size: 16px;  
    outline: none;  
    transition: width 0.3s var(--apple-ease), opacity 0.2s var(--apple-ease), padding 0.3s var(--apple-ease), border-color 0.2s var(--apple-ease);  
  }  
  .search-slot.open input[type="text"] {  
    width: 100%; 
    opacity: 1;  
    padding: 10px 18px;  
    border: 1px solid var(--border-subtle);  
  }  
  .search-slot.open input[type="text"]:focus { border-color: var(--accent-amber); }  
  input[type="text"]::placeholder { color: var(--text-secondary); }  

  /* Drawer Navigation */
  .drawer-overlay {  
    position: fixed; 
    inset: 0;  
    background: rgba(0, 0, 0, 0.7);  
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0; 
    pointer-events: none;  
    transition: opacity 0.3s var(--apple-ease);  
    z-index: 90;  
  }  
  .drawer-overlay.open { opacity: 1; pointer-events: auto; }  

  .drawer {  
    position: fixed; 
    top: 0; 
    left: 0; 
    bottom: 0;  
    width: min(320px, 85vw);  
    background: var(--bg-card);  
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-right: 1px solid var(--border-subtle);  
    z-index: 91;  
    transform: translateX(-100%);  
    transition: transform 0.4s var(--apple-ease);  
    display: flex; 
    flex-direction: column;  
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);  
  }  
  .drawer.open { transform: translateX(0); }  
  
  .drawer-head {  
    display: flex; 
    align-items: center; 
    justify-content: space-between;  
    padding: 24px 20px 16px;  
    border-bottom: 1px solid var(--border-subtle);  
  }  
  .drawer-head .dh-title {  
    font-size: 20px;  
    font-weight: 700;  
    letter-spacing: -0.01em;
    color: var(--text-primary);  
  }  
  .drawer-close {  
    background: rgba(255, 255, 255, 0.08); 
    border: none;  
    color: var(--text-secondary);  
    font-size: 20px; 
    line-height: 1;  
    cursor: pointer;  
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s var(--apple-ease), background 0.2s var(--apple-ease);
  }  
  .drawer-close:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.15); }  

  .drawer-list {  
    flex: 1;  
    overflow-y: auto;  
    padding: 12px 10px;  
    display: flex; 
    flex-direction: column; 
    gap: 4px;  
  }  
  .drawer-item {  
    display: flex; 
    align-items: center; 
    gap: 12px;  
    width: 100%;  
    text-align: left;  
    background: transparent;  
    border: none;  
    padding: 12px 16px;  
    border-radius: 12px;  
    font-size: 14px;  
    color: var(--text-secondary);  
    cursor: pointer;  
    transition: background 0.2s var(--apple-ease), color 0.2s var(--apple-ease), transform 0.1s var(--apple-ease);  
  }  
  .drawer-item .di-label { flex: 1; }  
  .drawer-item:hover { background: rgba(245, 166, 35, 0.08); color: var(--text-primary); }  
  .drawer-item:active { transform: scale(0.98); }
  .drawer-item.active {  
    background: rgba(245, 166, 35, 0.15);  
    color: var(--accent-amber);  
    font-weight: 600;  
  }  

  .toolbar {  
    display: flex;  
    justify-content: space-between;  
    align-items: center;  
    margin-top: 16px;  
    font-size: 12px;  
    color: var(--text-secondary);  
  }  

  .surprise-btn {  
    background: rgba(255, 255, 255, 0.08);  
    border: 1px solid rgba(255, 255, 255, 0.1);  
    color: var(--text-primary);  
    padding: 8px 16px;  
    border-radius: 980px;  
    font-size: 12px;  
    font-weight: 500;
    cursor: pointer;  
    transition: opacity 0.2s var(--apple-ease), transform 0.1s var(--apple-ease), border-color 0.2s var(--apple-ease), background 0.2s var(--apple-ease);
  }  
  .surprise-btn:hover { 
    border-color: var(--accent-amber); 
    background: rgba(245, 166, 35, 0.1);
    color: var(--accent-amber);
  }  
  .surprise-btn:active { transform: scale(0.98); }

  /* Grid & Cards System */
  .grid {  
    max-width: 640px;  
    margin: 24px auto 0;  
    padding: 0 16px;  
    display: grid;  
    grid-template-columns: 1fr;  
    gap: 16px;  
  }  
  @media (min-width: 560px){  
    .grid { grid-template-columns: 1fr 1fr; }  
  }  

  .card {  
    perspective: 1200px;  
    height: 200px;  
    transition: height 0.4s var(--apple-ease);  
  }  
  .card.flipped {  
    height: var(--flip-h, 340px);  
  }  
  .card-inner {  
    position: relative;  
    width: 100%; 
    height: 100%;  
    transition: transform 0.6s var(--apple-ease);  
    transform-style: preserve-3d;  
  }  
  .card.flipped .card-inner { transform: rotateY(180deg); }  

  .face {  
    position: absolute; 
    inset: 0;  
    backface-visibility: hidden;  
    border-radius: 20px;  
    padding: 20px;  
    overflow: hidden;  
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-subtle);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
  }  

  .front {  
    display: flex;  
    flex-direction: column;  
    justify-content: space-between;  
    cursor: pointer;  
    transition: border-color 0.2s var(--apple-ease), transform 0.2s var(--apple-ease);
  }  
  .front:hover { 
    border-color: var(--accent-amber); 
  }  
  .cat-icon { font-size: 22px; opacity: 0.9; margin-bottom: 4px; }  
  
  .card-name {  
    font-size: 20px;  
    font-weight: 700;  
    letter-spacing: -0.01em;  
    line-height: 1.25;  
    margin: 6px 0 10px;  
    color: var(--text-primary);  
  }  
  .tags {  
    display: flex; 
    flex-wrap: wrap; 
    gap: 6px;  
  }  
  .tag {  
    font-size: 11px;  
    font-weight: 600;  
    text-transform: uppercase;  
    letter-spacing: 0.05em;  
    padding: 4px 8px;  
    border-radius: 6px;  
    background: rgba(245, 166, 35, 0.12);  
    color: var(--accent-amber);  
    border: 1px solid rgba(245, 166, 35, 0.2);  
  }  

  .kitchen .tag {  
    background: rgba(52, 199, 89, 0.12);  
    color: var(--accent-green);  
    border-color: rgba(52, 199, 89, 0.2);  
  }  

  .tap-hint {  
    font-size: 11px;  
    color: var(--text-secondary);  
    letter-spacing: 0.02em;  
  }  

  .back {  
    color: var(--text-primary);  
    transform: rotateY(180deg);  
    font-size: 13px;  
    line-height: 1.5;  
    cursor: pointer;  
    overflow-y: auto;  
  }  
  .back b {  
    display: block;  
    color: var(--accent-amber);  
    font-size: 11px;  
    font-weight: 600;  
    text-transform: uppercase;  
    letter-spacing: 0.05em;  
    margin: 12px 0 4px;  
  }  
  .back b:first-child { margin-top: 0; }  
  .back .ticket-name {  
    font-size: 18px;  
    font-weight: 700;  
    letter-spacing: -0.01em;  
    color: var(--text-primary);  
    border-bottom: 1px solid var(--border-subtle);  
    padding-bottom: 8px;  
    margin-bottom: 8px;  
  }  

    .back-photo {  
    width: 100%;  
    height: 160px;  
    object-fit: contain; /* Отображает фото целиком без обрезки */
    background: rgba(0, 0, 0, 0.3); /* Темный фон для полей по краям */
    border-radius: 12px;  
    margin-bottom: 10px;  
    display: block;  
    cursor: zoom-in;  
    border: 1px solid var(--border-subtle);
    transition: opacity 0.2s var(--apple-ease), background 0.2s var(--apple-ease);
  }    
  .back-photo:hover { opacity: 0.9; }

  .ingredient-table { margin-bottom: 4px; }  
  .ingredient-row {  
    padding: 4px 0;  
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);  
    color: var(--text-secondary);
  }  
  .ingredient-row:last-child { border-bottom: none; }  

  /* Portion Calculator */  
  .portion-calculator {  
    margin: 14px 0;  
  }  
  .portion-calculator .calc-header {  
    padding: 12px;  
    background: rgba(245, 166, 35, 0.08);  
    border-radius: 12px;  
    border: 1px solid var(--border-subtle);
    margin-bottom: 8px;  
  }  
  .portion-calculator .calc-label {  
    display: block;  
    font-size: 11px;  
    text-transform: uppercase;  
    letter-spacing: 0.05em;  
    color: var(--accent-amber);  
    margin-bottom: 8px;  
    font-weight: 600;  
  }  
  .portion-calculator .calc-input-wrap {  
    display: flex;  
    gap: 8px;  
    align-items: center;  
  }  
  .portion-calculator .portion-input {  
    width: 80px;  
    padding: 6px 10px;  
    border: 1px solid var(--border-subtle);  
    border-radius: 8px;  
    background: rgba(0, 0, 0, 0.3);  
    color: var(--text-primary);  
    font-family: inherit;  
    font-size: 16px;  
  }  
  .portion-calculator .portion-input:focus {  
    outline: none;  
    border-color: var(--accent-amber);  
  }  
  .portion-calculator .calc-unit {  
    font-size: 11px;  
    color: var(--text-secondary);  
  }  
  .scaled-recipe {  
    margin-top: 10px;  
    padding: 10px 12px;  
    background: rgba(0, 0, 0, 0.2);  
    border-left: 3px solid var(--accent-amber);  
    border-radius: 8px;  
    font-size: 12px;  
    line-height: 1.6;  
    color: var(--text-secondary);  
  }  
  .scaled-recipe strong {  
    display: block;  
    color: var(--accent-amber);  
    font-size: 11px;  
    text-transform: uppercase;  
    letter-spacing: 0.05em;  
    margin-bottom: 4px;  
  }  
  .scaled-recipe .scaled-row { padding: 2px 0; }  
  .scaled-recipe .scaled-empty {  
    opacity: 0.6;  
    font-style: italic;  
  }  

  .empty {  
    text-align: center;  
    padding: 60px 20px;  
    font-size: 14px;  
    color: var(--text-secondary);  
  }  

  .note {  
    max-width: 640px;  
    margin: 40px auto 0;  
    padding: 16px 20px;  
    text-align: center;  
    font-size: 12px;  
    line-height: 1.6;  
    color: var(--text-secondary);  
    border-top: 1px solid var(--border-subtle);  
  }  

  @media (prefers-reduced-motion: reduce){  
    .card-inner { transition: none; }  
  }  

  .to-top {  
    position: fixed;  
    right: 20px;  
    bottom: 24px;  
    width: 48px;  
    height: 48px;  
    border-radius: 980px;  
    background: var(--accent-amber);  
    color: #17120e;  
    border: none;  
    font-size: 20px;  
    font-weight: 600;
    line-height: 1;  
    cursor: pointer;  
    box-shadow: 0 10px 20px rgba(0,0,0,0.4);  
    opacity: 0;  
    pointer-events: none;  
    transform: translateY(10px);  
    transition: opacity 0.2s var(--apple-ease), transform 0.2s var(--apple-ease);  
    z-index: 50;  
  }  
  .to-top:active {
    transform: scale(0.95);
  }
  .to-top.visible {  
    opacity: 1;  
    pointer-events: auto;  
    transform: translateY(0);  
  }  

  /* Lightbox */  
  .lightbox-overlay {  
    position: fixed;  
    inset: 0;  
    background: rgba(0, 0, 0, 0.85);  
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    z-index: 200;  
    display: flex;  
    align-items: center;  
    justify-content: center;  
    padding: 20px;  
    opacity: 0;  
    pointer-events: none;  
    transition: opacity 0.3s var(--apple-ease);  
  }  
  .lightbox-overlay.open {  
    opacity: 1;  
    pointer-events: auto;  
  }  
  .lightbox-img {  
    max-width: 100%;  
    max-height: 100%;  
    object-fit: contain;  
    border-radius: 16px;  
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);  
    transform: scale(0.95);  
    transition: transform 0.3s var(--apple-ease);  
  }  
  .lightbox-overlay.open .lightbox-img {  
    transform: scale(1);  
  }  
  .lightbox-close {  
    position: absolute;  
    top: 20px;  
    right: 20px;  
    width: 40px;  
    height: 40px;  
    border-radius: 50%;  
    background: rgba(255, 255, 255, 0.1);  
    border: 1px solid rgba(255, 255, 255, 0.15);  
    color: var(--text-primary);  
    font-size: 22px;  
    line-height: 1;  
    cursor: pointer;  
    display: flex;  
    align-items: center;  
    justify-content: center;  
    transition: background 0.2s var(--apple-ease), transform 0.1s var(--apple-ease);
  }  
  .lightbox-close:hover { background: rgba(255, 255, 255, 0.2); }  
  .lightbox-close:active { transform: scale(0.95); }
</style>  
</head>  
<body>  
<button class="to-top" id="toTop" aria-label="Наверх">↑</button>  
<header>  
  <div class="kicker">@BEERFACTORYbot · справочник</div>  
  <h1>BEERFACTORY</h1>  
    <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
    <a href="training.html" class="training-link">📚 Обучение для персонала</a>  
    <a href="attestation.html" class="training-link">📝 Аттестация</a>  
  </div>  
</header>  
  
<div class="controls">  
  <div class="topbar">  
    <button class="menu-trigger" id="menuBtn">  
      <span class="mt-icon">☰</span>  
      <span class="mt-label" id="menuLabel">Всё меню</span>  
      <span class="mt-chev">▾</span>  
    </button>  
    <div class="search-slot" id="searchSlot">  
      <button class="search-icon-btn" id="searchIconBtn" aria-label="Поиск">🔎 Поиск</button>  
      <input type="text" id="search" placeholder="найти по названию или тегу...">  
    </div>  
  </div>  
  <div class="toolbar">  
    <span id="count">— позиций</span>  
    <button class="surprise-btn" id="surprise">🎲 Не знаю, что выбрать</button>  
  </div>  
</div>  
  
<div class="drawer-overlay" id="drawerOverlay"></div>  
<aside class="drawer" id="drawer">  
  <div class="drawer-head">  
    <span class="dh-title">Категории</span>  
    <button class="drawer-close" id="drawerClose" aria-label="Закрыть">×</button>  
  </div>  
  <nav class="drawer-list" id="tabs">  
    <button class="drawer-item active" data-cat="all"><span class="di-label">Всё меню</span></button>  
    <button class="drawer-item" data-cat="Коктейль"><span class="di-label">🍹 Коктейли</span></button>  
    <button class="drawer-item" data-cat="Кухня"><span class="di-label">🍽 Кухня</span></button>  
    <button class="drawer-item" data-cat="Заготовка"><span class="di-label">🧂 Заготовки</span></button>  
    <button class="drawer-item" data-cat="Лимонад"><span class="di-label">🍋 Б/А Напитки</span></button>  
    <button class="drawer-item" data-cat="Настойка"><span class="di-label">🥃 Настойка</span></button>  
  </nav>  
</aside>  
  
<div class="grid" id="grid"></div>  
<div class="empty" id="empty" style="display:none">Ничего не нашлось. Попробуй другое слово.</div>  
  
<div class="note">  
  Сайт в разработке 
</div>  
  
<div class="lightbox-overlay" id="lightboxOverlay">  
  <button class="lightbox-close" id="lightboxClose" aria-label="Закрыть">×</button>  
  <img class="lightbox-img" id="lightboxImg" src="" alt="">  
</div>  
  
<script>  
// ====== ДЕМО-ДАННЫЕ ======  
const ITEMS = [  
  {name:"Яблоко-Саган", cat:"Коктейли", tags:["ягодный","освежающий"], compound:"Джин 40мл · яблочный сок 60мл · сироп саган-дайля 15мл · лайм", method:"Шейк со льдом, двойное процеживание", serving:"Коктейльный бокал, долька яблока"},  
  {name:"Дымная Гавана", cat:"Коктейли", tags:["ромовый","крепкий"], compound:"Тёмный ром 45мл · ананасовый сок 40мл · лайм 15мл · биттер", method:"Билд в стакане на льду, лёгкое копчение веточкой розмарина", serving:"Хайбол, лёд-кубик"},  
  {name:"Полынная Горечь", cat:"Коктейли", tags:["горький","аперитив"], compound:"Джин 35мл · Апероль 25мл · тоник · долька грейпфрута", method:"Билд в бокале со льдом, аккуратно долить тоник", serving:"Бокал для вина, лёд"},  
  {name:"Овсяный Штиль", cat:"Коктейли", tags:["сливочный","без алкоголя"], compound:"Овсяное молоко 100мл · эспрессо 30мл · кленовый сироп 10мл", method:"Взбить шейкером без льда, перелить на лёд", serving:"Рокс, корица сверху"},  
  {name:"Мясная тарелка домашних деликатесов", cat:"Кухня", tags:["мясная","на компанию"], compound:"Хамон, брезаола, суджук, домашняя ветчина, оливки, орехи", method:"Нарезка тонкими слайсами, выложить веером по кругу тарелки", serving:"Деревянная доска, 6 персон, горчица отдельно"},  
  {name:"Сырная тарелка", cat:"Кухня", tags:["сырная","на компанию"], compound:"Дор блю, качотта, пармезан, мёд, грецкий орех, виноград", method:"Разложить по фактуре от мягкого к твёрдому", serving:"Каменная доска, мёд в розетке"},  
  {name:"Брускетта с томатами", cat:"Кухня", tags:["лёгкая","вегетарианская"], compound:"Чиабатта, томаты черри, базилик, чеснок, олив. масло, бальзамик", method:"Обжарить хлеб, натереть чесноком, выложить томатную смесь", serving:"Тарелка, 3 шт, микрозелень"},  
  {name:"Крылья BBQ острые", cat:"Кухня", tags:["острая","горячая"], compound:"Куриные крылья, соус барбекю, чили-хлопья, сельдерей", method:"Маринад 2 часа, жарка во фритюре, глазирование соусом", serving:"Тарелка, соус блю-чиз, стебель сельдерея"},  
  {name:"Настойка «Перцовая»", cat:"Настойка", tags:["острая","крепкая"], compound:"Водка \"Русский стандарт\" 1л\nПерец Болгарский 80гр\nПерец Чили 40гр\nПерец Горошек 15гр\nСахарный Сироп 150мл", method:"Настаивать в тёмном месте 10-14 дней, ежедневно встряхивать, процедить через марлю", serving:"Рюмка, охлаждённая"},  
  {name:"Настойка апельсиновая", cat:"Настойка", tags:["цитрусовая","крепкая"], compound:"Светлый ром 750мл\nАпельсины 2 шт\nВанилин 1г\nМёд 50мл", method:"Нарезать апельсины кольцами, положить в банку с ромом, добавить ванилин и мёд, закрыть, настаивать 21 день", serving:"Рюмка, льдинка"},  
];  
  
// ====== ПОДКЛЮЧЕНИЕ К СВОЕЙ БАЗЕ NOCODB ======  
const CONFIG = {  
  useRemote: true,  
  baseUrl: "https://nocodb.puzzlebot.top",  
  tableId: "mqo5ga1nk6h8lv8",  
  kitchenTableId: "mc7m3sa4m2x12dd",  
  token: "uDwIj1M4tM3DkQdrJItq54GkxbdJFCJ6OUhETjA9",  
  categoryField: "Категория",  
};  
  
const CATEGORY_ICONS = {};  
document.querySelectorAll('#tabs .drawer-item[data-cat]').forEach(btn => {  
  const cat = btn.dataset.cat;  
  if (cat === 'all') return;  
  const firstWord = btn.querySelector('.di-label').textContent.trim().split(/\s+/)[0];  
  CATEGORY_ICONS[cat] = firstWord;  
});  
  
let DATA = ITEMS;  
  
async function fetchTable(tableId, forcedCategory){  
  const url = `${CONFIG.baseUrl}/api/v2/tables/${tableId}/records?limit=1000`;  
  const res = await fetch(url, { headers: { "xc-token": CONFIG.token } });  
  if(!res.ok) throw new Error("NocoDB ответил " + res.status + " для таблицы " + tableId);  
  const json = await res.json();  
  const rows = json.list || [];  
  return rows.map(r => {  
    const cat = forcedCategory || (r[CONFIG.categoryField] || "").trim() || "Коктейли";  
    let compound, method, serving;  
    if (cat === "Кухня") {  
      compound = r["Состав"] || "—";  
      method = r["Описание"] || "—";  
      serving = r["Граммовка"] || "—";  
    } else {  
      compound = r["Состав"] || "—";  
      method = r["Метод"] || r["Приготовление"] || "—";  
      serving = r["Подача"] || r["Вес"] || "—";  
    }  
    return {  
      name: r["Название"] || "Без названия",  
      cat: cat,  
      tags: (r["Теги"] || "").split(/\s+/).filter(Boolean),  
      compound: compound,  
      method: method,  
      serving: serving,  
      photo: r["Фото-ссылка"] || null,  
    };  
  });  
}  
  
async function loadData(){  
  if(!CONFIG.useRemote) return;  
  try{  
    const [mainItems, kitchenItems] = await Promise.all([  
      fetchTable(CONFIG.tableId, null),  
      CONFIG.kitchenTableId  
        ? fetchTable(CONFIG.kitchenTableId, "Кухня")  
        : Promise.resolve([]),  
    ]);  
    DATA = [...mainItems, ...kitchenItems];  
  }catch(e){  
    console.error("Не удалось загрузить NocoDB, показаны демо-данные:", e);  
  }  
}  
  
let state = { cat: "all", query: "" };  
  
function matches(item){  
  if(state.cat !== "all" && item.cat !== state.cat) return false;  
  if(state.query){  
    const q = state.query.toLowerCase();  
    const hay = (item.name + " " + item.tags.join(" ")).toLowerCase();  
    if(!hay.includes(q)) return false;  
  }  
  return true;  
}  
  
const UNIT_PATTERN = /(\d+(?:[.,]\d+)?\s*(?:мл|гр|г|кг|л|шт|порц\.?|долька|дольки|долек|слайс|слайса|слайсов|лист|листик|листика|листа|стебель|стебля|палочка|палочки|щепотка|щепотки|капля|капли|капель|зубчик|зубчика|зубчиков|пучок|пучка|ч\.л\.|ст\.л\.)\.?)\s+(?=[А-ЯЁ])/g;  
  
function ingredientRows(text){  
  let raw = String(text || "—").trim();  
  let lines;  
  if(/\\n/.test(raw)){  
    lines = raw.split(/\\n+/);  
  } else if(/\n/.test(raw)){  
    lines = raw.split(/\n+/);  
  } else {  
    const withBreaks = raw.replace(UNIT_PATTERN, "$1\n");  
    lines = withBreaks.split(/\n+/);  
  }  
  lines = lines.map(s => s.trim()).filter(Boolean);  
  if(lines.length === 0) lines = ["—"];  
  return lines.map(line => `<div class="ingredient-row">${line}</div>`).join("");  
}  
  
// ========== КАЛЬКУЛЯТОР ПОРЦИЙ ДЛЯ НАСТОЕК ==========  
  
function splitCompoundToLines(text){  
  let raw = String(text || "").trim();  
  let lines;  
  if(/\\n/.test(raw)){  
    lines = raw.split(/\\n+/);  
  } else if(/\n/.test(raw)){  
    lines = raw.split(/\n+/);  
  } else if(/·/.test(raw)){  
    lines = raw.split(/·/);  
  } else {  
    const withBreaks = raw.replace(UNIT_PATTERN, "$1\n");  
    lines = withBreaks.split(/\n+/);  
  }  
  return lines.map(s => s.trim()).filter(Boolean);  
}  
  
const INGREDIENT_RE = /^(.+?)\s+(\d+(?:[.,]\d+)?)\s*(мл|гр|г|кг|л|шт|порц|долька|дольки|долек|слайс|слайса|слайсов|лист|листик|листика|листа|стебель|стебля|палочка|палочки|щепотка|щепотки|капля|капли|капель|зубчик|зубчика|зубчиков|пучок|пучка|ч\.л\.|ст\.л\.)?\.?$/;  
  
function parseIngredients(text){  
  const lines = splitCompoundToLines(text);  
  return lines.map(line => {  
    const match = line.match(INGREDIENT_RE);  
    if(!match){  
      return { original: line, ingredient: line, number: null, unit: "" };  
    }  
    return {  
      original: line,  
      ingredient: match[1].trim(),  
      number: parseFloat(match[2].replace(",", ".")),  
      unit: match[3] || "",  
    };  
  });  
}  
  
function formatScaledNumber(num){  
  const rounded = Math.round(num * 100) / 100;  
  return String(rounded);  
}  
  
function scaleRecipe(text, multiplier){  
  const ingredients = parseIngredients(text);  
  return ingredients.map(ing => {  
    if(ing.number === null){  
      return ing.original;  
    }  
    const scaled = formatScaledNumber(ing.number * multiplier);  
    return `${ing.ingredient} ${scaled}${ing.unit ? " " + ing.unit : ""}`;  
  });  
}  
  
function createPortionCalculator(itemName){  
  const safeId = "calc-" + itemName.replace(/[^a-zA-Zа-яА-Я0-9]+/g, "-").toLowerCase();  
  return `  
    <div class="portion-calculator">  
      <div class="calc-header">  
        <label class="calc-label" for="${safeId}">Рассчитать на N порций</label>  
        <div class="calc-input-wrap">  
          <input  
            type="number"  
            id="${safeId}"  
            class="portion-input"  
            value="1"  
            min="0.5"  
            step="0.5"  
            inputmode="decimal"  
          >  
          <span class="calc-unit">порций (можно дробное, напр. 3.5)</span>  
        </div>  
      </div>  
      <div class="scaled-recipe"></div>  
    </div>  
  `;  
}  
  
// ========== ЛАЙТБОКС: УВЕЛИЧЕНИЕ ФОТО ПО КЛИКУ ==========  
const lightboxOverlay = document.getElementById("lightboxOverlay");  
const lightboxImg = document.getElementById("lightboxImg");  
const lightboxClose = document.getElementById("lightboxClose");  
  
function openLightbox(src, alt){  
  lightboxImg.src = src;  
  lightboxImg.alt = alt || "";  
  lightboxOverlay.classList.add("open");  
  document.body.style.overflow = "hidden";  
}  
function closeLightbox(){  
  lightboxOverlay.classList.remove("open");  
  document.body.style.overflow = "";  
  lightboxImg.src = "";  
}  
lightboxClose.addEventListener("click", closeLightbox);  
lightboxOverlay.addEventListener("click", (e) => {  
  if(e.target === lightboxOverlay) closeLightbox();  
});  
document.addEventListener("keydown", (e) => {  
  if(e.key === "Escape" && lightboxOverlay.classList.contains("open")) closeLightbox();  
});  
  
function render(){  
  const grid = document.getElementById("grid");  
  const empty = document.getElementById("empty");  
  const list = DATA.filter(matches);  
  
  document.getElementById("count").textContent = list.length + " позиций";  
  grid.innerHTML = "";  
  empty.style.display = list.length ? "none" : "block";  
  
  list.forEach(item => {  
    const isKitchen = item.cat === "Кухня";  
    const isRecipe = item.cat === "Настойка";  
    const icon = CATEGORY_ICONS[item.cat] || "🍹";  
  
    const card = document.createElement("div");  
    card.className = "card";  
    card.innerHTML = `  
  <div class="card-inner">  
    <div class="face front ${isKitchen ? 'kitchen' : ''}">  
      <div>  
        <div class="cat-icon">${icon}</div>  
        <div class="card-name">${item.name}</div>  
        <div class="tags">${item.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>  
      </div>  
      <div class="tap-hint">тапни для рецепта →</div>  
    </div>  
    <div class="face back">  
      ${item.photo ? `<img class="back-photo" src="${item.photo}" alt="${item.name}">` : ''}  
      <div class="ticket-name">${item.name}</div>  
      ${!isKitchen ? `<b>Состав</b><div class="ingredient-table">${ingredientRows(item.compound)}</div>` : ''}  
      ${isRecipe ? createPortionCalculator(item.name) : ''}  
      <b>${isKitchen ? 'Описание' : 'Метод'}</b>${item.method}  
      <b>${isKitchen ? 'Граммовка' : 'Подача'}</b>${item.serving}  
    </div>  
  </div>`;  
  
    const front = card.querySelector(".front");  
    const back = card.querySelector(".back");  
    front.addEventListener("click", () => card.classList.add("flipped"));  
    back.addEventListener("click", () => card.classList.remove("flipped"));  
  
    grid.appendChild(card);  
  
    const photoImg = back.querySelector(".back-photo");  
    if(photoImg){  
      photoImg.addEventListener("click", (e) => {  
        e.stopPropagation();  
        openLightbox(photoImg.src, photoImg.alt);  
      });  
    }  
  
    if(isRecipe){  
      const portionInput = back.querySelector(".portion-input");  
      const scaledDiv = back.querySelector(".scaled-recipe");  
      const originalCompound = item.compound;  
  
      function updateScaledRecipe(){  
        const raw = parseFloat(portionInput.value);  
        const multiplier = (!isNaN(raw) && raw > 0) ? raw : 1;  
        const rows = scaleRecipe(originalCompound, multiplier);  
        const rowsHtml = rows.length  
          ? rows.map(r => `<div class="scaled-row">• ${r}</div>`).join("")  
          : `<div class="scaled-empty">Не удалось разобрать состав на ингредиенты.</div>`;  
        scaledDiv.innerHTML = `<strong>На ${multiplier} порций</strong>` + rowsHtml;  
      }  
  
      portionInput.addEventListener("input", updateScaledRecipe);  
      portionInput.addEventListener("change", updateScaledRecipe);  
      portionInput.addEventListener("click", (e) => e.stopPropagation());
      portionInput.addEventListener("touchstart", (e) => e.stopPropagation());
      portionInput.addEventListener("focus", (e) => e.stopPropagation());
  
  
      updateScaledRecipe();  
    }  
  
    const naturalHeight = back.scrollHeight + 8;  
    card.style.setProperty("--flip-h", Math.max(naturalHeight, 220) + "px");  
  });  
}  
  
const drawer = document.getElementById("drawer");  
const drawerOverlay = document.getElementById("drawerOverlay");  
const menuLabel = document.getElementById("menuLabel");  
  
function openDrawer(){  
  drawer.classList.add("open");  
  drawerOverlay.classList.add("open");  
  document.body.style.overflow = "hidden";  
}  
function closeDrawer(){  
  drawer.classList.remove("open");  
  drawerOverlay.classList.remove("open");  
  document.body.style.overflow = "";  
}  
document.getElementById("menuBtn").addEventListener("click", openDrawer);  
document.getElementById("drawerClose").addEventListener("click", closeDrawer);  
drawerOverlay.addEventListener("click", closeDrawer);  
  
document.getElementById("tabs").addEventListener("click", (e) => {  
  const btn = e.target.closest(".drawer-item");  
  if(!btn) return;  
  document.querySelectorAll(".drawer-item").forEach(t => t.classList.remove("active"));  
  btn.classList.add("active");  
  state.cat = btn.dataset.cat;  
  menuLabel.textContent = btn.querySelector(".di-label").textContent;  
  render();  
  closeDrawer();  
});  
  
const searchSlot = document.getElementById("searchSlot");  
const searchInput = document.getElementById("search");  
document.getElementById("searchIconBtn").addEventListener("click", () => {  
  searchSlot.classList.add("open");  
  searchInput.focus();  
});  
searchInput.addEventListener("blur", () => {  
  if(!searchInput.value.trim()) searchSlot.classList.remove("open");  
});  
  
document.getElementById("search").addEventListener("input", (e) => {  
  state.query = e.target.value.trim();  
  render();  
});  
  
document.getElementById("surprise").addEventListener("click", () => {  
  const pool = DATA.filter(i => state.cat === "all" ? true : i.cat === state.cat);  
  const pick = pool[Math.floor(Math.random() * pool.length)];  
  document.getElementById("search").value = "";  
  state.query = "";  
  render();  
  const cards = [...document.querySelectorAll(".card-name")];  
  const target = cards.find(c => c.textContent === pick.name);  
  if(target){  
    const card = target.closest(".card");  
    card.scrollIntoView({behavior:"smooth", block:"center"});  
    setTimeout(() => card.classList.add("flipped"), 350);  
  }  
});  
  
const toTopBtn = document.getElementById("toTop");  
document.body.addEventListener("scroll", () => {  
  if(document.body.scrollTop > window.innerHeight * 0.6){  
    toTopBtn.classList.add("visible");  
  } else {  
    toTopBtn.classList.remove("visible");  
  }  
});  
toTopBtn.addEventListener("click", () => {  
  document.body.scrollTo({ top: 0, behavior: "smooth" });  
});  
  
loadData().then(render);  
</script>  
  
</body>  
</html>
