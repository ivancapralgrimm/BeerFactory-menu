<!DOCTYPE html>  
<html lang="ru">  
<head>  
  <!-- Универсальные мобильные иконки для BeerFactory -->  
  
<!-- Настройки для iPhone -->  
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">  
<meta name="apple-mobile-web-app-title" content="BeerFactory">  
<meta name="apple-mobile-web-app-capable" content="yes">  
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">  
  
<!-- Настройки для Android и других браузеров -->  
<link rel="manifest" href="manifest.json">  
<meta name="theme-color" content="#17120e">  
  
<!-- Иконка для вкладок браузера на ПК -->  
<link rel="icon" type="image/png" sizes="32x32" href="apple-touch-icon.png">  
<meta charset="UTF-8">  
<!-- viewport — чтобы на телефоне сайт не масштабировался как десктопная версия,  
     и чтобы поле ввода при фокусе не вызывало авто-зум браузера -->  
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">  
<title>BeerFactory — меню</title>  
<link rel="stylesheet" href="styles.css">
</head>  
<body>  
<button class="to-top" id="toTop" aria-label="Наверх">↑</button>  
<header>  
  <div class="kicker">@BEERFACTORYbot · справочник</div>  
  <h1>BEERFACTORY</h1>  
    <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
    <a href="training.html" class="training-link">📚 Обучение для персонала</a>  
    <a href="attestation.html" class="training-link">📝 Аттестация</a>  
  </div>  
</header>  
  
<div class="controls">  
  <div class="topbar">  
    <button class="menu-trigger" id="menuBtn">  
      <span class="mt-icon">☰</span>  
      <span class="mt-label" id="menuLabel">Всё меню</span>  
      <span class="mt-chev">▾</span>  
    </button>  
    <div class="search-slot" id="searchSlot">  
      <button class="search-icon-btn" id="searchIconBtn" aria-label="Поиск">🔎 Поиск</button>  
      <input type="text" id="search" placeholder="найти по названию или тегу...">  
    </div>  
  </div>  
  <div class="toolbar">  
    <span id="count">— позиций</span>  
    <button class="surprise-btn" id="surprise">🎲 Не знаю, что выбрать</button>  
  </div>  
</div>  
  
<div class="drawer-overlay" id="drawerOverlay"></div>  
<aside class="drawer" id="drawer">  
  <div class="drawer-head">  
    <span class="dh-title">Категории</span>  
    <button class="drawer-close" id="drawerClose" aria-label="Закрыть">×</button>  
  </div>  
  <nav class="drawer-list" id="tabs">  
    <button class="drawer-item active" data-cat="all"><span class="di-label">Всё меню</span></button>  
    <button class="drawer-item" data-cat="Коктейль"><span class="di-label">🍹 Коктейли</span></button>  
    <button class="drawer-item" data-cat="Кухня"><span class="di-label">🍽 Кухня</span></button>  
    <button class="drawer-item" data-cat="Заготовка"><span class="di-label">🧂 Заготовки</span></button>  
    <button class="drawer-item" data-cat="Лимонад"><span class="di-label">🍋 Б/А Напитки</span></button>  
    <button class="drawer-item" data-cat="Настойка"><span class="di-label">🥃 Настойка</span></button>  
  </nav>  
</aside>  
  
<div class="grid" id="grid"></div>  
<div class="empty" id="empty" style="display:none">Ничего не нашлось. Попробуй другое слово.</div>  
  
<div class="note">  
  Сайт в разработке 
</div>  
  
<div class="lightbox-overlay" id="lightboxOverlay">  
  <button class="lightbox-close" id="lightboxClose" aria-label="Закрыть">×</button>  
  <img class="lightbox-img" id="lightboxImg" src="" alt="">  
</div>  
  
<script src="script.js"></script>
  
</body>  
</html>
